name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle VacuumTube modules
        working-directory: web
        run: |
          npm ci
          node build.mjs
          node test/smoke.cjs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (win-x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish OmniTube.csproj -c Release -o publish -p:SourceRevisionId=$env:GITHUB_SHA 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          # surface errors/warnings as annotations (readable through the API without log access)
          Select-String -Path build.log -Pattern ': (error|warning) ' | Select-Object -First 40 | ForEach-Object {
            $line = $_.Line -replace '%','%25' -replace "`r",'' -replace "`n",' '
            if ($line -match ': error ') { "::error::$line" } else { "::warning::$line" }
          }
          Select-String -Path build.log -Pattern 'CefSharp.*\d+\.\d+\.\d+' | Select-Object -First 3 | ForEach-Object { "::notice::$($_.Line)" }
          exit $code

      - name: List output
        shell: pwsh
        run: Get-ChildItem publish | Select-Object Name, Length | Format-Table -AutoSize

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath OmniTube-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OmniTube-win-x64
          path: OmniTube-win-x64.zip

      - name: Publish "latest" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest OmniTube-win-x64.zip --target $env:GITHUB_SHA --prerelease `
            --title "OmniTube (latest build)" `
            --notes "Automatic build of $env:GITHUB_SHA"
          exit $LASTEXITCODE
